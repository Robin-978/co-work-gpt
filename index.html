<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>派對抽選器 Mobile</title>
<style>
:root{--bg:#0f172a;--panel:#111827;--card:#1f2937;--text:#f9fafb;--muted:#cbd5e1;--line:rgba(255,255,255,.12);--brand:#fbbf24;--brand2:#38bdf8;--danger:#fb7185;--ok:#34d399}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Microsoft JhengHei UI","Noto Sans TC",system-ui,sans-serif;background:radial-gradient(circle at 20% 0%,rgba(56,189,248,.22),transparent 34%),radial-gradient(circle at 85% 10%,rgba(251,191,36,.18),transparent 32%),linear-gradient(160deg,#020617,#0f172a 55%,#111827);color:var(--text)}button,input{font:inherit}.app{width:min(980px,100%);min-height:100vh;margin:0 auto;padding:18px 16px 28px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{margin:0 0 4px;color:var(--brand2);letter-spacing:.16em;text-transform:uppercase;font-size:12px}.top h1{margin:0;font-size:clamp(28px,8vw,56px);letter-spacing:.04em}.iconBtn{width:48px;height:48px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.08);color:var(--text)}.stage{position:relative;overflow:hidden;margin:26px 0 18px;border:1px solid var(--line);border-radius:32px;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));min-height:45vh;display:grid;place-items:center;box-shadow:0 24px 80px rgba(0,0,0,.32)}.stage:before{content:"";position:absolute;inset:-35%;background:conic-gradient(from 0deg,transparent,rgba(251,191,36,.25),transparent,rgba(56,189,248,.22),transparent);animation:spin 7s linear infinite}.stageContent{position:relative;text-align:center;padding:34px 18px}.status{margin:0 0 14px;color:var(--muted);font-size:clamp(16px,4vw,24px)}.result{min-height:1.25em;font-weight:900;font-size:clamp(42px,15vw,116px);line-height:1.1;text-shadow:0 0 28px rgba(251,191,36,.45);word-break:break-word}.pool{margin:18px 0 0;color:var(--muted)}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.primary{grid-column:1/-1;border:0;border-radius:24px;padding:20px;background:linear-gradient(135deg,var(--brand),#f97316);color:#111827;font-size:24px;font-weight:900;box-shadow:0 14px 36px rgba(251,191,36,.22)}.secondary,.smallBtn,.dangerBtn{border:1px solid var(--line);border-radius:18px;padding:13px;background:rgba(255,255,255,.08);color:var(--text)}.hint{margin-top:16px;padding:14px 16px;border:1px solid var(--line);border-radius:20px;color:var(--muted);background:rgba(15,23,42,.72)}.modal{position:fixed;inset:0;z-index:20;background:rgba(2,6,23,.72);display:none;align-items:flex-end;padding:12px}.modal.show{display:flex}.dialog{width:min(860px,100%);max-height:88vh;margin:0 auto;overflow:auto;border:1px solid var(--line);border-radius:28px;background:#111827;box-shadow:0 24px 90px rgba(0,0,0,.48)}.dialogHead{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;padding:18px;background:rgba(17,24,39,.96);border-bottom:1px solid var(--line)}.dialogHead h2{margin:0;font-size:24px}.form{display:grid;grid-template-columns:1fr 86px 86px;gap:10px;padding:16px}.form input,.row input{min-width:0;border:1px solid var(--line);border-radius:16px;padding:12px;background:#0f172a;color:var(--text)}.batch{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px 14px}.list{display:grid;gap:10px;padding:0 16px 20px}.row{display:grid;grid-template-columns:46px 1fr 76px 70px;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.04)}.row input[type=checkbox]{width:24px;height:24px}.dangerBtn{color:#fecdd3;border-color:rgba(251,113,133,.45)}.flash{animation:flash .8s ease-out}.rolling{animation:bounce .16s ease-in-out infinite alternate}@keyframes spin{to{transform:rotate(360deg)}}@keyframes flash{0%{filter:brightness(1)}35%{filter:brightness(1.65)}100%{filter:brightness(1)}}@keyframes bounce{to{transform:scale(1.035)}}@media(max-width:560px){.app{padding:14px 12px 24px}.stage{min-height:44vh;border-radius:26px}.controls{grid-template-columns:1fr}.form{grid-template-columns:1fr 72px}.form button{grid-column:1/-1}.batch{grid-template-columns:1fr 1fr}.row{grid-template-columns:36px 1fr 60px}.row .dangerBtn{grid-column:2/-1}.top h1{font-size:34px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div><p class="eyebrow">Party Draw</p><h1>派對抽選器</h1></div><button id="manageBtn" class="iconBtn" aria-label="管理選項">⚙</button></header>
<section id="stage" class="stage" aria-live="polite"><div class="stageContent"><p id="status" class="status">準備開始</p><div id="result" class="result">點下開始抽選</div><p id="pool" class="pool">目前抽選池：0 個項目</p></div></section>
<section class="controls"><button id="drawBtn" class="primary">開始抽選</button><button id="fullBtn" class="secondary">全螢幕</button><button id="soundBtn" class="secondary">音效：開</button></section>
<section class="hint"><strong>提示：</strong>手機瀏覽器開啟後，可從分享選單選「加入主畫面」。資料會保存在此裝置的瀏覽器本機。</section>
</main>
<div id="modal" class="modal"><section class="dialog" role="dialog" aria-modal="true"><header class="dialogHead"><div><p class="eyebrow">Options</p><h2>管理抽選項目</h2></div><button id="closeBtn" class="iconBtn" aria-label="關閉">✕</button></header><form id="form" class="form"><input id="nameInput" maxlength="60" placeholder="輸入獎項或人名"><input id="weightInput" type="number" min="1" max="999" value="1" inputmode="numeric"><button class="smallBtn">新增</button></form><div class="batch"><button id="allBtn" class="smallBtn" type="button">全選</button><button id="noneBtn" class="smallBtn" type="button">全不選</button><button id="exportBtn" class="smallBtn" type="button">匯出</button><button id="importBtn" class="smallBtn" type="button">匯入</button><input id="fileInput" hidden type="file" accept="application/json,.json"></div><div id="list" class="list"></div></section></div>
<script>
(function(){
'use strict';
var key='party-draw-mobile-v1';
var items=[];var soundOn=true;var rolling=false;var audioCtx=null;
var $=function(id){return document.getElementById(id)};
function cleanName(s){return String(s||'').replace(/[<>]/g,'').replace(/\s+/g,' ').trim().slice(0,60)}
function cleanWeight(v){var n=parseInt(v,10);if(!isFinite(n)||n<1)n=1;if(n>999)n=999;return n}
function load(){try{var raw=localStorage.getItem(key);items=raw?JSON.parse(raw):[]}catch(e){items=[]}if(!items.length){items=[{name:'頭獎',weight:1,enabled:true},{name:'二獎',weight:1,enabled:true},{name:'安慰獎',weight:1,enabled:true}]}normalize();save();render()}
function normalize(){var next=[];for(var i=0;i<items.length;i++){var n=cleanName(items[i].name);if(n){next.push({name:n,weight:cleanWeight(items[i].weight),enabled:items[i].enabled!==false})}}items=next}
function save(){localStorage.setItem(key,JSON.stringify(items))}
function active(){return items.filter(function(x){return x.enabled})}
function updatePool(){var a=active();$('pool').textContent='目前抽選池：'+a.length+' 個項目'}
function render(){var list=$('list');list.innerHTML='';items.forEach(function(it,idx){var row=document.createElement('article');row.className='row';var c=document.createElement('input');c.type='checkbox';c.checked=it.enabled;c.onchange=function(){items[idx].enabled=c.checked;save();updatePool()};var n=document.createElement('input');n.value=it.name;n.onchange=function(){items[idx].name=cleanName(n.value)||it.name;n.value=items[idx].name;save()};var w=document.createElement('input');w.type='number';w.min='1';w.max='999';w.value=it.weight;w.onchange=function(){items[idx].weight=cleanWeight(w.value);w.value=items[idx].weight;save()};var d=document.createElement('button');d.type='button';d.className='dangerBtn';d.textContent='刪除';d.onclick=function(){items.splice(idx,1);save();render()};row.appendChild(c);row.appendChild(n);row.appendChild(w);row.appendChild(d);list.appendChild(row)});updatePool()}
function beep(freq,dur,type,gain){if(!soundOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();var osc=audioCtx.createOscillator();var g=audioCtx.createGain();osc.type=type||'sine';osc.frequency.value=freq;g.gain.value=gain||0.035;osc.connect(g);g.connect(audioCtx.destination);osc.start();g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+dur/1000);osc.stop(audioCtx.currentTime+dur/1000)}catch(e){}}
function weightedPick(pool){var total=0;pool.forEach(function(x){total+=cleanWeight(x.weight)});var r=Math.random()*total;for(var i=0;i<pool.length;i++){r-=cleanWeight(pool[i].weight);if(r<=0)return pool[i]}return pool[pool.length-1]}
function draw(){if(rolling)return;var pool=active();if(!pool.length){$('status').textContent='沒有可抽選項目';$('result').textContent='請先到管理選項勾選項目';beep(180,220,'sawtooth',0.05);return}rolling=true;$('drawBtn').disabled=true;$('stage').classList.add('rolling');$('status').textContent='抽選中';var count=0;var max=34+Math.floor(Math.random()*18);var timer=setInterval(function(){var p=pool[Math.floor(Math.random()*pool.length)];$('result').textContent=p.name;beep(520+count*7,45,'square',0.018);count++;if(count>=max){clearInterval(timer);var win=weightedPick(pool);$('result').textContent=win.name;$('status').textContent='公布結果';$('stage').classList.remove('rolling');$('stage').classList.add('flash');beep(784,130,'triangle',0.05);setTimeout(function(){beep(988,180,'triangle',0.045)},150);setTimeout(function(){$('stage').classList.remove('flash')},850);$('drawBtn').disabled=false;rolling=false}},70)}
$('manageBtn').onclick=function(){$('modal').classList.add('show')};$('closeBtn').onclick=function(){$('modal').classList.remove('show')};$('modal').onclick=function(e){if(e.target===$('modal'))$('modal').classList.remove('show')};$('form').onsubmit=function(e){e.preventDefault();var n=cleanName($('nameInput').value);if(!n){beep(180,160,'sawtooth',0.05);return}items.push({name:n,weight:cleanWeight($('weightInput').value),enabled:true});$('nameInput').value='';$('weightInput').value='1';save();render()};$('allBtn').onclick=function(){items.forEach(function(x){x.enabled=true});save();render()};$('noneBtn').onclick=function(){items.forEach(function(x){x.enabled=false});save();render()};$('drawBtn').onclick=draw;$('soundBtn').onclick=function(){soundOn=!soundOn;$('soundBtn').textContent='音效：'+(soundOn?'開':'關');if(soundOn)beep(660,90,'sine',0.04)};$('fullBtn').onclick=function(){if(!document.fullscreenElement){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}else{document.exitFullscreen&&document.exitFullscreen()}};$('exportBtn').onclick=function(){var blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='party-draw-items.json';a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)};$('importBtn').onclick=function(){$('fileInput').click()};$('fileInput').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var data=JSON.parse(String(r.result||'[]'));if(!Array.isArray(data))throw new Error('bad');items=data;normalize();save();render()}catch(e){alert('匯入失敗：JSON 格式不正確')}};r.readAsText(f,'utf-8');this.value=''};window.addEventListener('keydown',function(e){if(e.key==='Escape')$('modal').classList.remove('show');if(e.key==='Enter'&&!$('modal').classList.contains('show'))draw()});load();
})();
</script>
</body>
</html>
